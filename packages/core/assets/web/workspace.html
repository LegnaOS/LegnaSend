<!DOCTYPE html>
<html><head><script src="/assets/theme.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>LegnaSend</title><link rel="stylesheet" href="/assets/web-ui.css"><link rel="stylesheet" href="/assets/theme.css"></head>
<body class="workspace-page"><noscript>LegnaSend requires JavaScript.</noscript>
<header class="app-header"><div class="header-inner"><div class="brand"><span class="brand-mark" data-icon="send"></span>LegnaSend</div><div class="header-tools"><span data-theme-control></span><span id="connection-badge" class="connection-badge"></span><select id="web-language" aria-label="Language"><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="zh-HK">繁體中文（香港）</option></select></div></div></header>
<main class="duplex-shell"><div class="workspace-toolbar"><div role="tablist" id="workspace-tabs"><button id="tab-download" type="button" role="tab" aria-controls="pane-download"></button><button id="tab-upload" type="button" role="tab" aria-controls="pane-upload"></button></div><span id="workspace-state" role="status"></span></div>
<div class="workspace-pane" id="pane-download" role="tabpanel" aria-labelledby="tab-download"><p id="workspace-empty" class="workspace-message"></p></div>
<div class="workspace-pane" id="pane-upload" role="tabpanel" aria-labelledby="tab-upload" hidden><p id="workspace-disabled" class="workspace-message"></p></div>
</main><script src="/assets/web-i18n.js"></script><script src="/assets/web-ui.js"></script><script src="/assets/workspace.js"></script></body></html>
